# ─── Shared environment ───────────────────────────────────────────────────────
x-app-env: &app-env
  DATABASE_URL:            ${DATABASE_URL:-postgresql://dates_user:dates_pass@postgres:5432/dates_db}
  REDIS_URL:               ${REDIS_URL:-redis://redis:6379}
  AUTH_SECRET:             ${AUTH_SECRET:-change-me-in-production-min-32-chars}
  NEXT_PUBLIC_APP_URL:     ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
  AUTH_URL:                ${AUTH_URL:-http://localhost:3000}
  META_WHATSAPP_TOKEN:     ${META_WHATSAPP_TOKEN:-}
  META_PHONE_NUMBER_ID:    ${META_PHONE_NUMBER_ID:-}
  REMINDER_HOURS_BEFORE:   ${REMINDER_HOURS_BEFORE:-24}

services:

  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER:     dates_user
      POSTGRES_PASSWORD: dates_pass
      POSTGRES_DB:       dates_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # No public ports — only accessible within Docker network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dates_user -d dates_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    # No public ports — only accessible within Docker network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── Database migrations ──────────────────────────────────────────────────────
  migrate:
    build:
      context: .
      target: migrator
    environment:
      <<: *app-env
    command: >
      sh -c "
        echo 'UPDATE \"_prisma_migrations\" SET rolled_back_at = NOW() WHERE finished_at IS NULL AND rolled_back_at IS NULL;' |
          ./node_modules/.bin/prisma db execute --stdin 2>/dev/null || true &&
        ./node_modules/.bin/prisma migrate deploy &&
        (./node_modules/.bin/tsx prisma/seed.ts || true)
      "
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # ── Next.js app ──────────────────────────────────────────────────────────────
  app:
    build: .
    restart: unless-stopped
    environment:
      <<: *app-env
    ports:
      - "3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/api/auth/session || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── BullMQ Worker ─────────────────────────────────────────────────────────────
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    environment:
      <<: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
